# Optuna RF-DETR Training Configuration
study:
  name: "test_study"

classes:
  - "Class_1"
  - "Class_2"
  - "Class_3"
  - "Class_4"

# Index of class to use for primary optimization metric (mAP50-95)
# If null, uses average across all classes
optimization_target_class: 2  # Class_3

paths:
  pretrained_model_weights: "rf-detr-nano.pth"
  split_dataset: "split_dataset"
  final_dataset: "Final_dataset"
  data_yaml: "data.yaml" #In final_dataset
  optuna_json: null  # Auto-generated from study.name
  output_csv: null   # Auto-generated from study.name
  output_json: null  # Auto-generated from study.name
  runs_dir: "runs"
  params_json: "training_params.json"
  training_worker_script: "utils/rf_detr_distributed_worker.py"

preprocessing:
  input_size: 256
  training_size: 256
  edit_labels: false

augmentations:
  brightness: -0.12655
  contrast: 0.18471
  sharpness: 0.15792
#Note any "paths" entered have to be converted to strings in rf_detr_trainer.py
rfdetr_training:
  dataset_dir: None  # Defaults to paths.final_dataset if None
  devices: "auto"
  batch_size: 1
  grad_accum_steps: 4
  epochs: 1
  resolution: 512
  early_stopping: true
  early_stopping_patience: 1
  early_stopping_min_delta: 0.5
  lr: 1e-4
  lr_encoder: 1.5e-4
  weight_decay: 1e-4
  lr_drop: 11
  clip_max_norm: 0.1
  lr_vit_layer_decay: 0.8
  lr_component_decay: 1.0
  aug_config: "AUG_AGGRESSIVE" #String version of rf-detr augmentation config.
  use_ema: false
  dropout: 0
  drop_path: 0
  drop_mode: "standard"
  drop_schedule: "constant"
  cutoff_epoch: 0
  set_cost_class: 2
  set_cost_bbox: 5
  set_cost_giou: 2
  cls_loss_coef: 2
  bbox_loss_coef: 5
  giou_loss_coef: 2
  focal_alpha: 0.25

rfdetr_dataset:
  test_threshold: 0.03
  iou_threshold: 0.5
  num_gpus: 1
  num_trials: 1

optuna:
  n_trials: 1
  n_jobs: 1
  optimize: false  # Set to true to use Optuna hyperparameter optimization
  #parameter for optuna to optimise. currently limited to rf-detr params. 
  search_space:
    lr:
      type: float
      low: 1e-5
      high: 1e-3
      log: true